name: Deploy static demo to GitHub Pages

# The full app is a Swift server plus a static page. GitHub Pages serves only static files, so this
# publishes the same page with pages/demo-shim.js answering its /api calls from data/sessions.json.

on:
  push:
    branches: [main]
    paths:
      - "swift-server/Public/**"
      - "data/sessions.json"
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site/data
          cp -R swift-server/Public/. site/
          cp data/sessions.json site/data/sessions.json
          cp pages/demo-shim.js site/demo-shim.js
          # Project pages live under /hallway-track/, so make asset paths relative, load the shim
          # before the app, and drop the RUM script (no Dash0 token in a public static demo).
          sed -i \
            -e 's#href="/app.css"#href="./app.css"#' \
            -e 's#<script src="/app.js" defer></script>#<script src="./demo-shim.js"></script><script src="./app.js" defer></script>#' \
            -e '/dash0-web.js/d' \
            site/index.html
          touch site/.nojekyll
          grep -c 'demo-shim.js' site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
