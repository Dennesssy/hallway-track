apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallway-track
  namespace: hallway-track
  labels:
    app: hallway-track
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hallway-track
  template:
    metadata:
      labels:
        app: hallway-track
    spec:
      containers:
        - name: hallway-track
          image: ghcr.io/hallway/hallway-track:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hallway-track-config
            - secretRef:
                name: hallway-track-secret
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
